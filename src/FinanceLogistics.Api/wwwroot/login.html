<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập · Finance–Logistics</title><link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">FINANCE · LOGISTICS</p><h1>Đăng nhập</h1>
    <p>Dùng tài khoản công ty đã được cấp quyền cho hệ thống.</p>
    <form id="login-form">
      <label for="username">Tài khoản</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="320" required autofocus>
      <label for="password">Mật khẩu công ty</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button id="submit" type="submit">Đăng nhập</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="muted">Nếu chưa được cấp quyền hoặc cần đổi mật khẩu, liên hệ IT.</p>
  </main>
  <script type="module" src="/js/login.mjs"></script>
</body>
</html>
